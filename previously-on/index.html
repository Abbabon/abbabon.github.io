d a metal cradle with an empty slot where something the size of a shoebox should be — the on board computer is gone. The MI6 Handler reacts: \"Damn. Have a look around the tent for it.\" 'Inspect crashed object' is ticked off and a new objective appears: LOOK FOR THE ON-BOARD COMPUTER. You turn back out of the crater to scan the dome — stacked flight cases, a robotic arm rig and crates along the white plastic screens.", "events": [{"type": "discovery", "text": "Bond inspects the glowing blue compartment inside the crashed craft — the on-board computer's cradle is empty; someone has already removed it", "frame": 3, "frame_file": "1789574917.jpg"}, {"type": "dialogue", "text": "MI6 Handler: \"Damn. Have a look around the tent for it.\"", "frame": 3, "frame_file": "1789574917.jpg"}, {"type": "quest_completed", "text": "Objective completed: Inspect crashed object", "frame": 5, "frame_file": "1789574921.jpg"}, {"type": "quest_accepted", "text": "NEW OBJECTIVE: LOOK FOR THE ON-BOARD COMPUTER", "frame": 5, "frame_file": "1789574921.jpg"}], "on_screen_text": ["Inspect crashed object", "MI6 Handler: Damn. Have a look around the tent for it.", "Look", "NEW OBJECTIVE", "LOOK FOR THE ON-BOARD COMPUTER"]}, {"t": 1789574934, "t_end": 1789574968, "frames": ["1789574934.jpg", "1789574943.jpg", "1789574949.jpg", "1789574955.jpg", "1789574959.jpg", "1789574968.jpg"], "game": "007 First Light", "location": "Valley camp, inside the floodlit dome tent around the crashed craft's crater", "activity": "Searching the dome tent's crates and flight cases for the missing on-board computer", "summary": "Still under the objective 'Look for the on-board computer', you work your way around the dome tent in the parka, rummaging through the equipment. You lean into an open crate beside a stack of tall flight cases and a folded robotic-arm rig, sprint across scattered sheets of paper on the ground, and pry up the lid of a rugged case against the white tent wall. Down by the crater's edge you open a smaller case full of rolled tubes and canisters on the rocks, then move along the crates towards the far side where another lid has been flipped open. The search ends at a bench draped with a yellow tarp: beside a Universal Exports flight case and a kit bag stamped 'Property of the Government of the United Kingdom' sits the red-lit rack of wired cylinders seen earlier, and the game autosaves as you reach it. The computer has not been found yet.", "events": [{"type": "quest_progress", "text": "Searching the dome tent for the on-board computer: opened crates and flight cases stacked around the crater, papers scattered on the floor, nothing found yet", "frame": 1, "frame_file": "1789574934.jpg"}, {"type": "discovery", "text": "Opened a case at the crater's edge containing rolled tubes/canisters — not the on-board computer", "frame": 4, "frame_file": "1789574955.jpg"}, {"type": "discovery", "text": "Reached a tarp-covered bench near the red-lit rack of wired cylinders; a Universal Exports flight case and a kit bag marked 'Property of the Government of the United Kingdom' sit beside it; autosave triggered", "frame": 6, "frame_file": "1789574968.jpg"}], "on_screen_text": ["Look for the on-board computer", "UNIVERSAL EXPORTS", "PROPERTY OF THE GOVERNMENT OF THE UNITED KINGDOM", "SAVING"]}, {"t": 1789574993, "t_end": 1789575044, "frames": ["1789574993.jpg", "1789575011.jpg", "1789575019.jpg", "1789575028.jpg", "1789575034.jpg", "1789575044.jpg"], "game": "007 First Light", "location": "Valley camp — dome tent airlock tunnel and the red-cross medical hut beyond it", "activity": "Poisoned inside the dome tent; staggering through the airlock tunnel into the medical hut to find an antidote", "summary": "Standing at the tarp-covered bench, you watch two figures in orange hazmat suits and gas masks come in through the dome's round airlock hatch. Moments later your vision turns sickly green and blurred — you have been exposed to something inside the tent — and a NEW OBJECTIVE appears: FIND ANTIDOTE, with the game autosaving. Hunched over, you stagger across the cables toward the red medical-cross door at the far end of the dome, through the red-lit ringed airlock tunnel and its red doors. On the far side, through a yellow haze, a hazmat-suited figure's legs are seen standing over you as you crawl across the grated floor. You push on into a green-lit medical hut with steel shelving, a cabinet of supplies and a window with more orange-suited figures beyond it, and end up at a shelf where an open case and several small vials lie spilled on the floor — still searching for the antidote.", "events": [{"type": "other", "text": "Two figures in orange hazmat suits and gas masks enter the dome tent through the round airlock hatch", "frame": 1, "frame_file": "1789574993.jpg"}, {"type": "quest_accepted", "text": "Bond's vision turns green and blurred — poisoned/exposed inside the dome. NEW OBJECTIVE: FIND ANTIDOTE (autosave)", "frame": 2, "frame_file": "1789575011.jpg"}, {"type": "quest_progress", "text": "Staggers through the red-lit ringed airlock tunnel toward the red medical-cross doors", "frame": 3, "frame_file": "1789575019.jpg"}, {"type": "other", "text": "Crawling on the grated floor in a yellow haze while a hazmat-suited figure stands over him", "frame": 4, "frame_file": "1789575028.jpg"}, {"type": "quest_progress", "text": "Reaches a green-lit medical hut with shelving and supply cabinets; reaches a shelf where an open case and vials lie spilled on the floor, searching for the antidote", "frame": 6, "frame_file": "1789575044.jpg"}], "on_screen_text": ["NEW OBJECTIVE", "FIND ANTIDOTE", "Find antidote", "SAVING", "UNIVERSAL EXPORTS"]}, {"t": 1789575049, "t_end": 1789575144, "frames": ["1789575049.jpg", "1789575067.jpg", "1789575087.jpg", "1789575108.jpg", "1789575133.jpg", "1789575144.jpg"], "game": "007 First Light", "location": "Valley camp — green-lit medical hut beyond the dome's airlock tunnel, then a rocky slope outside the camp at dawn", "activity": "Recovering from the poisoning in the medical hut (a masked hostile ends up on the floor), taking new instructions from the MI6 Handler about a meeting, then moving outside", "summary": "Still poisoned and hunched, you push past the medical hut's drawer cabinet of pill bottles and the shelving of flight cases with the objective Find antidote still up. The screen goes to black, and when it comes back a masked hostile in a parka is lying on the grated floor with his eyes open while Bond quips \"That might be pushing it. What next?\" — your vision is clear again, so the antidote has done its job. Standing upright in the hut, now in his Navy flight suit with a chest rig, Bond listens as the MI6 Handler tells him the next thing to find out: \"Where they'll be meeting and at what time.\" A moment later you are crouched among rocks and grass outside at dawn, Royal Navy crown patch on your shoulder, as the game autosaves.", "events": [{"type": "quest_completed", "frame": 4, "text": "Bond's vision clears — the antidote has been taken; a masked hostile in a parka is left lying on the medical hut floor. Bond: \"That might be pushing it. What next?\"", "frame_file": "1789575108.jpg"}, {"type": "dialogue", "frame": 5, "text": "MI6 Handler: \"Where they'll be meeting and at what time.\" — new instruction: find out the hostiles' meeting place and time", "frame_file": "1789575133.jpg"}, {"type": "discovery", "frame": 6, "text": "Bond crouches among rocks outside the camp at dawn in his Royal Navy flight suit; autosave", "frame_file": "1789575144.jpg"}], "on_screen_text": ["Find antidote", "Bond: That might be pushing it. What next?", "MI6 Handler: Where they'll be meeting and at what time.", "SAVING"]}, {"t": 1789575161, "t_end": 1789575225, "frames": ["1789575161.jpg", "1789575178.jpg", "1789575187.jpg", "1789575199.jpg", "1789575208.jpg", "1789575225.jpg"], "game": "007 First Light", "location": "Valley camp — rocky slope above the huts (F4, F8) and the container yard at dawn", "activity": "Crouching on the rocks above the camp, following the guards to the lower yard and learning captives are being held in containers B4 and G9 while the hostiles prepare to blow the place up", "summary": "Crouched among the rocks at dawn you watch a group of red-jacketed and parka-clad hostiles gather near hut F4 as one calls out \"Wrap it up. We're leaving.\" A new objective, Follow the guards, appears and you squeeze through a narrow rock crevice to shadow them, emerging on a ledge overlooking a lower yard by hut F8 where tracked-vehicle trails cross the ground; several hostiles walk below and a body in an orange jumpsuit lies in the dirt. In a cutscene Bond surveys the camp and reports \"But the hostiles plan to blow up the place.\" Follow the guards ticks off and a new objective appears — SAVE THE CAPTIVES — as Bond mutters to himself: \"Okay James, two containers: B4 or G9. Which one's first?\"", "events": [{"type": "dialogue", "text": "Hostile: \"Wrap it up. We're leaving.\" — hostiles gathering near hut F4 to move out", "frame": 1, "frame_file": "1789575161.jpg"}, {"type": "quest_accepted", "text": "New objective: Follow the guards", "frame": 2, "frame_file": "1789575178.jpg"}, {"type": "discovery", "text": "From a ledge above hut F8: hostiles crossing the lower yard, a body in an orange jumpsuit lying on the ground", "frame": 3, "frame_file": "1789575187.jpg"}, {"type": "dialogue", "text": "Bond: \"But the hostiles plan to blow up the place.\"", "frame": 4, "frame_file": "1789575199.jpg"}, {"type": "quest_completed", "text": "Objective completed: Follow the guards", "frame": 6, "frame_file": "1789575225.jpg"}, {"type": "quest_accepted", "text": "New objective: SAVE THE CAPTIVES — Bond: \"Okay James, two containers: B4 or G9. Which one's first?\"", "frame": 6, "frame_file": "1789575225.jpg"}], "on_screen_text": ["NEW OBJECTIVE", "Hostile: Wrap it up. We're leaving.", "SAVING", "Follow the guards", "F4", "F8", "Bond: But the hostiles plan to blow up the place.", "NEW OBJECTIVE SAVE THE CAPTIVES", "Bond: Okay James, two containers: B4 or G9. Which one's first?"]}, {"t": 1789575236, "t_end": 1789575270, "frames": ["1789575236.jpg", "1789575251.jpg", "1789575254.jpg", "1789575258.jpg", "1789575259.jpg", "1789575270.jpg"], "game": "007 First Light", "location": "Valley camp — tall grass and rock crevices between hut F8 and container G9, at dawn", "activity": "Sneaking through grass and a rocky crevasse toward container G9 to search for the captives", "summary": "With the objective Save the captives now reading \"Search containers B4 and G9\", you crouch through tall grass below hut F8 while hostiles move about the yard, then climb up into the rocks (\"Ok, no time to hesitate.\") and spot a lit container marked G9 across a gully. Slipping through a narrow rock crevice you reach a ledge above it with a Drop down prompt, Bond noting \"Should be able to use that crevasse to avoid being spotted.\"", "events": [{"type": "quest_progress", "text": "Save the captives — sub-objective: Search containers B4 and G9", "frame": 1, "frame_file": "1789575236.jpg"}, {"type": "dialogue", "text": "Bond: Ok, no time to hesitate.", "frame": 2, "frame_file": "1789575251.jpg"}, {"type": "discovery", "text": "Container G9 sighted — a lit hut marked G9 across the rocky gully", "frame": 3, "frame_file": "1789575254.jpg"}, {"type": "dialogue", "text": "Bond: Should be able to use that crevasse to avoid being spotted. (Drop down prompt above the crevasse near G9)", "frame": 6, "frame_file": "1789575270.jpg"}], "on_screen_text": ["Save the captives", "Search containers B4 and G9", "F8", "Bond: Ok, no time to hesitate.", "G9", "Drop down", "Bond: Should be able to use that crevasse to avoid being spotted."]}, {"t": 1789575287, "t_end": 1789575328, "frames": ["1789575287.jpg", "1789575289.jpg", "1789575314.jpg", "1789575316.jpg", "1789575320.jpg", "1789575328.jpg"], "game": "007 First Light", "location": "Inside container G9 at the valley camp, dawn", "activity": "Sneaking up on a lone guard inside container G9, taking him down and getting the keys", "summary": "Dropping down beside container G9, you crouch behind crates while a hostile out in the yard remarks \"Look at this. Guy was writing home to his wife.\" (a \"dash to cover\" hint appears). You slip inside G9 — a control room with a whiteboard of aerial photos and a panel of switches — where a lone hostile grumbles \"Remind me why I'm the one babysitting these breathing problems?\" You creep up behind him, pin him to the floor with a takedown and leave him sprawled unconscious. The sub-objective \"Get the keys\" ticks off, and \"Search containers B4 and G9\" remains with a 7m marker pointing to a keypad door in the container.", "events": [{"type": "dialogue", "text": "Hostile 1: Look at this. Guy was writing home to his wife.", "frame": 2, "frame_file": "1789575289.jpg"}, {"type": "dialogue", "text": "Hostile: Remind me why I'm the one babysitting these breathing problems?", "frame": 3, "frame_file": "1789575314.jpg"}, {"type": "other", "text": "Bond takes down the lone hostile inside container G9 from behind, leaving him unconscious on the floor", "frame": 5, "frame_file": "1789575320.jpg"}, {"type": "quest_progress", "text": "Save the captives — Get the keys (completed); Search containers B4 and G9 continues (7m marker on a keypad door)", "frame": 6, "frame_file": "1789575328.jpg"}], "on_screen_text": ["Save the captives", "Search containers B4 and G9", "to dash to cover.", "Hostile 1: Look at this. Guy was writing home to his wife.", "Hostile: Remind me why I'm the one babysitting these breathing problems?", "Get the keys", "7m"]}, {"t": 1789575331, "t_end": 1789575331, "frames": ["1789575331.jpg"], "game": "007 First Light", "location": "Office area inside container G9 at the valley camp, dawn", "activity": "Walking through G9's office toward the marked door while searching the container for the captives", "summary": "Only a moment passes. Still inside container G9 with \"Get the keys\" ticked and \"Search containers B4 and G9\" active, you walk past a desk in the container's office: a monitor showing camera/photo feeds, an open flight case, a desk lamp, scattered papers and a framed photo of a climber on the wall. The objective marker points off to the left, toward the keypad door.", "events": [{"type": "quest_progress", "text": "Save the captives — Search containers B4 and G9: crossing G9's office (desk with monitor, open flight case and papers) toward the marked door", "frame": 1, "frame_file": "1789575331.jpg"}], "on_screen_text": ["Save the captives", "Get the keys", "Search containers B4 and G9"]}], "frames": ["1789573540.jpg", "1789573542.jpg", "1789573567.jpg", "1789573583.jpg", "1789573584.jpg", "1789573585.jpg", "1789573610.jpg", "1789573625.jpg", "1789573628.jpg", "1789573630.jpg", "1789573635.jpg", "1789573645.jpg", "1789573649.jpg", "1789573653.jpg", "1789573654.jpg", "1789573679.jpg", "1789573704.jpg", "1789573729.jpg", "1789573754.jpg", "1789573776.jpg", "1789573796.jpg", "1789573803.jpg", "1789573814.jpg", "1789573820.jpg", "1789573823.jpg", "1789573828.jpg", "1789573839.jpg", "1789573851.jpg", "1789573855.jpg", "1789573868.jpg", "1789573882.jpg", "1789573893.jpg", "1789573918.jpg", "1789573940.jpg", "1789573960.jpg", "1789573972.jpg", "1789573997.jpg", "1789574022.jpg", "1789574047.jpg", "1789574072.jpg", "1789574097.jpg", "1789574122.jpg", "1789574147.jpg", "1789574172.jpg", "1789574197.jpg", "1789574222.jpg", "1789574242.jpg", "1789574257.jpg", "1789574278.jpg", "1789574300.jpg", "1789574312.jpg", "1789574337.jpg", "1789574349.jpg", "1789574353.jpg", "1789574374.jpg", "1789574399.jpg", "1789574424.jpg", "1789574443.jpg", "1789574460.jpg", "1789574485.jpg", "1789574503.jpg", "1789574513.jpg", "1789574515.jpg", "1789574529.jpg", "1789574535.jpg", "1789574543.jpg", "1789574548.jpg", "1789574560.jpg", "1789574564.jpg", "1789574566.jpg", "1789574584.jpg", "1789574588.jpg", "1789574600. <script>
const D=JSON.parse(document.getElementById('data').textContent);const $=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t?new Date(t*1000).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
const hms=s=>{s=Math.max(0,Math.floor(s));return [s/3600|0,(s%3600)/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const state={tab:'session',slide:0};
function setAccent(c){document.documentElement.style.setProperty('--accent',c||D.brand.accent)}
const mid=a=>a[Math.floor(a.length/3)];function thumb(g){const r=g.recaps[g.recaps.length-1];if(r&&r.frames.length)return `media/recaps/${r.dir}/frames/${mid(r.frames)}`;const s=D.sessions[g.sessions[0]];return s&&s.frames.length?`media/sessions/${s.name}/${mid(s.frames)}`:''}
function home(){setAccent();$.innerHTML=`<h1>Your games</h1><p class="small">${D.games.length} game(s), ${Object.keys(D.sessions).length} session(s)</p><div class="grid">`+D.games.map(g=>`<a class="card" href="#/g/${g.key}"><div class="thumb" style="background-image:url('${thumb(g)}')"></div><div class="body"><h3>${esc(g.title)}</h3><div class="small">${g.sessions.length} session(s) · ${g.recaps.length} recap(s) · last played ${fmt(g.last_played)}</div><div style="margin-top:6px"><span class="chip">${g.pack}</span></div></div></a>`).join('')+`</div>`}
function game(key){const g=D.games.find(x=>x.key===key);if(!g)return home();setAccent(g.accent);const r=g.recaps[g.recaps.length-1];
let h=`<div class="crumbs"><a href="#/">Games</a> › ${esc(g.title)}</div><h1>${esc(g.title)}</h1><p class="small">Pack: <span class="chip on">${g.pack}</span> ${g.state.last_location?'· last seen at '+esc(g.state.last_location):''}</p>`;
if(r){h+=`<h2>${esc(r.title)} <span class="small">· ${fmt(r.created)}</span></h2><div class="vid"><div>${r.videos.length?`<video controls src="media/recaps/${r.dir}/${r.videos[0]}" poster="media/recaps/${r.dir}/frames/${r.frames[0]||''}"></video>`:'<p>No video rendered.</p>'}</div><div class="panel"><div class="small" style="font-family:Futura,Helvetica;letter-spacing:.08em">THE HIGHLIGHTS · SPOKEN SCRIPT</div><div class="script">${r.script.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}</div><p><b>Next up:</b> ${esc(r.next_step)}</p></div></div>`;
const tabs=[['session','The session'],['quests','Quests & threads'],['notes','Full account'],['people','People & things']];
h+=`<div class="tabs">${tabs.map(([k,l])=>`<span class="chip ${state.tab===k?'on':''}" onclick="state.tab='${k}';state.slide=0;render()">${l}</span>`).join('')}</div><div class="panel">`;
if(state.tab==='session'){const c=r.chapters;if(!c.length)h+='<p>No chapters.</p>';else{const i=Math.min(state.slide,c.length-1),ch=c[i];h+=`<div class="slide"><img class="frame" src="media/recaps/${r.dir}/frames/${ch.frame}" onerror="this.style.display='none'"><div><div class="small">Chapter ${i+1} of ${c.length}</div><h3 style="margin:4px 0 10px">${esc(ch.title)}</h3><p>${esc(ch.text)}</p></div></div><div class="nav"><button onclick="state.slide=Math.max(0,${i}-1);render()">‹ Prev</button><button onclick="state.slide=Math.min(${c.length-1},${i}+1);render()">Next ›</button><span class="small">${c.map((_,j)=>j===i?'●':'○').join(' ')}</span></div>`}}
else if(state.tab==='quests'){const order={open:0,thread:1,done:2};h+=[...r.quest_notes].sort((a,b)=>order[a.status]-order[b.status]).map(q=>`<div class="quest ${q.status}"><b>${esc(q.quest)}</b> <span class="chip">${q.status}</span><div>${esc(q.detail)}</div></div>`).join('')||'<p>Nothing logged.</p>'}
else if(state.tab==='notes'){h+=`<div class="two">${r.notes.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`}
else{const s=g.state,b=g.brief||{};const list=(t,a,f)=>a&&a.length?`<div><h4>${t}</h4><ul>${a.map(f).join('')}</ul></div>`:'';
h+=`<div class="kv">${list('People you have met',s.people,x=>`<li>${esc(x)}</li>`)}${list('Names the game has shown',s.known_names,x=>`<li>${esc(x)}</li>`)}${list('Key items',s.key_items,x=>`<li>${esc(x)}</li>`)}${list('Unresolved',s.unresolved,x=>`<li>${esc(x)}</li>`)}${list('Things (reference)',b.things,x=>`<li><b>${esc(x.name)}</b>: ${esc(x.what)}</li>`)}${list('Places (reference)',b.locations,x=>`<li><b>${esc(x.name)}</b>: ${esc(x.what)}</li>`)}</div>`}
h+='</div>'}
h+=`<h2>Sessions</h2><div class="grid">`+[...g.sessions].reverse().map(n=>{const s=D.sessions[n];return `<a class="card" href="#/s/${n}"><div class="thumb" style="background-image:url('media/sessions/${n}/${mid(s.frames)||''}')"></div><div class="body"><h3>${esc(n)}</h3><div class="small">${fmt(s.meta.started)} · ${hms((s.meta.ended||0)-(s.meta.started||0))} · ${s.frames.length} frames · ${s.events.length} batches</div></div></a>`}).join('')+'</div>';
if(g.recaps.length>1)h+=`<h2>Earlier recaps</h2><div class="grid">`+g.recaps.slice(0,-1).reverse().map(x=>`<div class="card"><div class="thumb" style="background-image:url('media/recaps/${x.dir}/${x.save_card?'save-card.png':'frames/'+x.frames[0]}')"></div><div class="body"><h3>${esc(x.title)}</h3><div class="small">${fmt(x.created)} · ${x.pack}</div>${x.videos.map(v=>`<a href="media/recaps/${x.dir}/${v}">${v}</a> `).join('')}</div></div>`).join('')+'</div>';
$.innerHTML=h}
function session(n){const s=D.sessions[n];if(!s)return home();const g=D.games.find(x=>x.sessions.includes(n));setAccent(g&&g.accent);const st=s.meta.started||0;
let h=`<div class="crumbs"><a href="#/">Games</a> › ${g?`<a href="#/g/${g.key}">${esc(g.title)}</a> › `:''}${esc(n)}</div><h1>${esc(n)}</h1><p class="small">${fmt(st)} · ${hms((s.meta.ended||0)-st)} of play · ${s.frames.length} frames kept · source: ${esc(s.meta.source)}</p>`;
h+=s.events.map(e=>`<div class="batch"><div class="t">${hms(e.t-st)}<br>${e.frames.length} frames</div><div><b>${esc(e.location)}</b><div>${esc(e.summary)}</div><div style="margin:6px 0">${e.events.map(ev=>`<span class="pill ${ev.type}" title="${esc(ev.text)}">${ev.type.replace('_',' ')}: ${esc(ev.text)}</span>`).join('')}</div><div class="strip">${e.frames.map(f=>`<img src="media/sessions/${n}/${f}" loading="lazy" onclick="lb(this.src)">`).join('')}</div></div></div>`).join('');
if(!s.events.length)h+=`<p>Not observed yet.</p><div class="strip">${s.frames.map(f=>`<img src="media/sessions/${n}/${f}" loading="lazy" onclick="lb(this.src)">`).join('')}</div>`;
$.innerHTML=h}
function lb(src){document.getElementById('lbi').src=src;document.getElementById('lb').style.display='flex'}
function render(){const p=location.hash.replace(/^#\/?/,'').split('/');if(p[0]==='g')game(p[1]);else if(p[0]==='s')session(decodeURIComponent(p.slice(1).join('/')));else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{state.tab='session';state.slide=0;render()});render();
</script></body></html>
