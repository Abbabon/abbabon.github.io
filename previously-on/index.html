:root{--ink:#14121a;--paper:#f6f1e7;--card:#fffaf0;--accent:#00E0B8;--muted:#6b6560}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,serif}
a{color:inherit}header{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:2px solid var(--ink);background:var(--card)}
header img{height:34px}header .tag{color:var(--muted);font-style:italic;margin-left:auto}

.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;text-decoration:none;display:block;transition:transform .1s}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}

.card .body{padding:14px 16px}.card h3{margin:0 0 4px;font-size:20px}.small{color:var(--muted);font-size:13px}
.frame{border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);max-width:100%;display:block;background:#000}
h1{font-size:38px;margin:0 0 4px}h2{font-size:24px;margin:34px 0 12px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.chip{display:inline-block;padding:2px 12px;border:2px solid var(--ink);border-radius:999px;font-size:13px;background:var(--card);margin:2px 4px 2px 0}
.chip.on,.pill.on{background:var(--accent);color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs .chip{cursor:pointer;font-family:Futura,Helvetica,sans-serif;padding:6px 18px}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:22px}
.script{max-height:260px;overflow:auto;padding-right:8px}
.two{columns:2;column-gap:36px}.two p{break-inside:avoid;margin-top:0}
.pill{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font-size:12px;margin:2px 3px 2px 0;background:#fff}
.pill.quest_completed,.pill.boss{background:var(--accent)}.pill.death{background:#f5b0a5}.pill.item{background:#f8e7a0}
.vid{display:grid;grid-template-columns:3fr 2fr;gap:22px;align-items:start}@media(max-width:820px){.vid{grid-template-columns:1fr}.two{columns:1}}
video{width:100%;border:3px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);background:#000}
.slide{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}@media(max-width:820px){.slide{grid-template-columns:1fr}}
.nav{display:flex;gap:10px;margin-top:12px;align-items:center}button{font:inherit;border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:6px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.quest{border:2px solid var(--ink);border-radius:10px;padding:10px 14px;margin:8px 0;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.quest.open{border-left:10px solid var(--accent)}.quest.thread{border-left:10px solid #d9a86b}.quest.done{opacity:.65}
.batch{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:16px 0;border-bottom:1px dashed var(--muted)}
.batch .t{font-family:Menlo,monospace;font-size:13px;color:var(--muted)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.strip img{height:90px;border:3px solid var(--ink);border-radius:6px;cursor:zoom-in;flex:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:94vw;max-height:92vh;border:3px solid #fff}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:12px}.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.kv h4{margin:0 0 6px}.kv ul{margin:0;padding-left:18px}

<script id="data" type="application/json">{"brand": {"name": "Previously On", "tagline": "Your game, from the last checkpoint.", "accent": "#00E0B8"}, "games": [{"key": "007-first-light", "title": "007 First Light", "sessions": ["bond-part1"], "recaps": [{"dir": "20260917-194549", "title": "The Empty Cradle", "pack": "dossier", "script": "You were inside container G9 at a valley camp at dawn, keys taken off the guard you had just put on the floor, walking past a desk of monitors toward a keypad door with people locked behind it. Two Royal Navy helicopters went in at night, callsigns Lead and Follow, and missiles took both inside a minute. You gave the Exit order, went down with the aircraft and came up alone on a rocky shore, wreckage burning and nothing on the radio but static. Then the torches came, armed men sweeping the beach, and you went into the tall grass. When a voice finally answered, it was not the Navy. An MI6 Handler took control of the mission, told you nothing, and pointed you at a light beyond the mountain. You climbed, under the chapter title Against the Odds, dropped into a lagoon, and found a floodlit dome guarded by men in red jackets standing over crates of MI6 explosives. In hut A2 you pulled on a parka and found a man in an orange jumpsuit shot dead in the washroom; in another hut, a rocket launcher, serial 394 KLB 211, built to bring down aircraft. A masked hostile mistook you for one of the crew, had you back up the BT-65, and Hostile 1 congratulated you on downing both helicopters yourself. Inside the dome the Handler finally named the target, a shoebox-sized on board computer from a crashed craft, and the cradle was empty. Something in that tent poisoned you; you crawled past hazmat suits to a medical hut, found the antidote, and left a hostile lying on the floor. Now the hostiles are wrapping up and plan to blow the camp, and the G9 guard was grumbling about babysitting these breathing problems. Open the keypad door, then find container B4.", "next_step": "Use the keys from the G9 guard to open the marked keypad door inside container G9 (7m marker, off to the left of the office desk), then search container B4.", "chapters": [{"title": "Lead and Follow", "text": "Two military helicopters flew low through night fog while Base read the mission details to Lead. Red tracers came up out of the dark; you called break left and deployed flares, then reported that Follow was down. The cabin filled with fire and smoke, and you gave the Exit order to the armed soldiers braced by the door.", "frame": "1789573635.jpg"}, {"title": "Into the Water", "text": "The picture cut to black and came back underwater: a slant of red light, drifting particles, and a helmetless dark-haired pilot sinking with one arm raised. He surfaced gasping and clawed at a rock, then waded out through burning wreckage onto a rocky shore. Nobody from either aircraft appeared, and the radio gave only static.", "frame": "1789573754.jpg"}, {"title": "Torches on the Beach", "text": "Armed men with flashlights began sweeping the shoreline, and they were not rescue. You crouched through tall grass behind boulders, followed a stream up a gully to the sparking wreck, and finally got a voice: an MI6 Handler announcing that MI6 was taking control of the mission, effective immediately. The pilot was named as Bond, and the objective Locate the camp sent you uphill toward a light on the far side of the mountain.", "frame": "1789574072.jpg"}, {"title": "Against the Odds", "text": "Ledges, a rain-slicked crevice, a waterfall cavern and a hang over the drop brought you to the summit, where the chapter title AGAINST THE ODDS appeared over a large floodlit dome in the valley below. You asked whether the retrieval was for alien technology; the Handler did not bite. You dropped from the cliff into a lagoon marked by orange poles and red buoys and waded for the camp.", "frame": "1789574278.jpg"}, {"title": "Hut A2", "text": "Men in red jackets stood over crates on the shore, and you recognised MI6 explosives: this was MI6's own retrieval camp. You went in through a window of hut A2, pulled a Parka out of a kit bag, and noted a Briefcase on a crate. In the washroom a man in an orange jumpsuit sat dead against a blood-spattered electrical cabinet, and a hostile's SMG lay on a bench beside a towel.", "frame": "1789574543.jpg"}, {"title": "The Launcher", "text": "In a container hut you inspected an encrypted military radio and then a rocket launcher in an open case, serial 394 KLB 211, stencilled GUIDED MISSILE SYSTEM INTERCEPT-AERIAL. You read the serial aloud for the Handler. It is the obvious candidate for the weapon that took down both helicopters.", "frame": "1789574680.jpg"}, {"title": "Back This Up", "text": "Behind a muddy tracked transporter a masked hostile shouted at you to back it up, remote's right there. You played along, moved the BT-65 from the console, and overheard talk of a messy German job. On the way out Hostile 1 called after you that he'd heard you downed both helicopters in less than a minute. You also picked up the 7 of Acorns near the console table.", "frame": "1789574792.jpg"}, {"title": "The Command Tent and the Dome", "text": "The Handler asked you to enter the big central tent. Its door carried an Isleford Defence Systems plate, IDS-TX100, made in the United Kingdom. Inside you asked about bombs and were told you were still on a need-to-know basis. The orange tunnel opened into the dome: white screens, film lights, a rack of red-lit wired cylinders, and in the middle a smoking crater with the charred wreck of a large craft.", "frame": "1789574894.jpg"}, {"title": "Shoebox", "text": "The Handler finally said what the job was: an on board computer, the size of a shoebox. Inside the wreck's blue-lit compartment the cradle was empty. You searched crates and flight cases around the crater and found nothing but rolled tubes and canisters, ending at a tarp-covered bench where a Universal Exports flight case and a kit bag stamped Property of the Government of the United Kingdom sat beside the wired cylinders.", "frame": "1789574917.jpg"}, {"title": "Find Antidote", "text": "Two figures in orange hazmat suits and gas masks came through the airlock, and your vision turned green and blurred. You staggered through the red-lit tunnel toward the medical-cross doors, crawled across a grated floor with a hazmat figure standing over you, and reached a green-lit medical hut with vials spilled on the floor. The screen went black; when it returned a masked hostile lay on the floor with his eyes open, your sight was clear, and you asked the Handler what next.", "frame": "1789575028.jpg"}, {"title": "Wrap It Up", "text": "The Handler's answer was to find out where they'll be meeting and at what time. At dawn, back in your Navy flight suit and chest rig, you watched red jackets and parkas gather near hut F4 as one called out to wrap it up, they were leaving. You followed them through a rock crevice to a ledge above hut F8, where a second body in an orange jumpsuit lay in the dirt, and reported that the hostiles plan to blow up the place. The objective became Save the Captives: two containers, B4 or G9.", "frame": "1789575225.jpg"}, {"title": "Container G9", "text": "You used a crevasse to reach G9 unseen while a hostile outside remarked that some guy had been writing home to his wife. Inside, a lone guard in a tan jacket and headset complained about babysitting these breathing problems. You took him down from behind, took the keys, and were crossing the office past a monitor of camera feeds and an open flight case toward the keypad door when the session ended.", "frame": "1789575328.jpg"}], "notes": "Full account of session bond-part1 (single session, roughly 30 minutes of play from a new game).\n\nPrologue. The game opened on two military helicopters in night fog. Base told Lead that mission details were in, then finished with \"That's all I've got.\" Red tracers appeared; the helmeted Royal Navy pilot called \"Break left. We've got incoming. Deploying flares,\" then \"Base, we are under attack. Follow is down.\" With the cabin on fire he ordered \"Severe damage. More incoming. Exit. Repeat Exit,\" stood and gestured to the armed soldiers at the door. Cut to black, then underwater: red light, particles, the pilot (now helmetless, dark-haired) sinking limply. He surfaced gasping, gripped a rock, waded through burning wreckage onto a rocky night shore. First control: Move, then Look. A brief cut showed a red churning boil of foam and smoke (unexplained). The radio produced only static; he pressed a hand to his ear trying to raise anyone. No survivors were seen among the burning wreckage.\n\nSearchers and the Handler. Armed men with flashlights swept the beach. You crouched through tall grass behind boulders (Crouch tutorial: move while crouched in tall grass to stay hidden; Dash also listed; three Movement skills locked), followed a stream up a gully to the sparking wreck. Slumped on the hillside, face bloodied, you got the MI6 Handler: \"We're taking control of this mission, effective immediately.\" Asked what you could see: \"No, but there's some light coming from the other side of the mountain.\" The pilot is named Bond. Objective: Locate the camp. \"Gotta find higher ground.\"\n\nClimb. Narrow lichen ledge, tight rain-slicked crevice (Sprint tutorial), waterfall cavern. Handler: \"That's good. Keep your eyes peeled.\" Bond: \"How can I help if I don't know what's going on?\" Hang prompt onto a rock ledge, grassy shelf, then the summit view: a large floodlit dome in a dark valley. Chapter title card AGAINST THE ODDS. Bond: \"Retrieval mission. Of what exactly. Alien technology?\" Objective: Reach the camp. Down through wet rocks, hang from the cliff, Drop down into water. Surfaced in a shallow lagoon marked by orange-lit poles and red buoys, waded toward the camp lights.\n\nCamp shore and hut A2. Crouched along the shore under a red-jacketed patrol. Two men in red jackets stood by crates at the water's edge; Bond: \"MI6 explosives. You're the ones running the retrieval mission.\" Reached prefab hut A2: \"There's a window here I can get through.\" Inside the bunk room, pulled a Parka from a kit bag (\"A Parka.\"). Reach the camp completed, autosave. Bond: \"Picked up a few phrases while mountain climbing there\" (implies he knows some of the local language; which language is not stated). Objective: Search the room. Card table with kit bag, bulletin board with maps, a Briefcase on a crate with an Inspect prompt (not clearly examined), bunks. Through a doorway, a man in an orange jumpsuit slumped against a cabinet with blood on the wall. Washroom: broken glass, bloodied mirror. \"Someone's lying here. He's been shot.\" An SMG on a bench beside a towel, inspect card: \"Belongs to one of the hostiles.\" Not taken. Examined the body against a blood-spattered electrical cabinet, checked a toilet stall, ended at the sinks.\n\nSearch the camp. Leaving A2, Handler: \"Don't draw attention to yourself.\" Objective: Search the camp. Floodlit stores shed stacked with RATIONS boxes, a hooded figure on its ramp. A masked armed guard in a dark parka stood among the crates directly ahead with the dome behind. Passed a container hut marked LG 209 with a masked guard outside. Inside a hut, inspected a RADIO on a crate (\"Military grade. Encrypted.\") and on a desk a rocket launcher in an open case: \"ROCKET LAUNCHER — Serial: 394 KLB 211\", stencilled GUIDED MISSILE SYSTEM / INTERCEPT-AERIAL. Bond read the serial aloud: \"Rocket launcher. Serial three nine four, KLB, two one one.\" Outside, crouched behind crates and a muddy tracked transporter numbered 618, masked parka-clad hostiles moving around the yard. One shouted: \"Hey! You! Back this up for me! Remote's right there!\"\n\nMove the BT-65. Sub-objective MOVE THE BT-65. You stood at the rugged remote console and reversed the transporter toward the stores shed while hostiles walked past. Bond: \"Some of them just mentioned a messy German job.\" In the stores shed, Handler: \"Listen, I'm going to ask you to enter the big central tent.\" Sub-objective Enter tent. Collectible picked up near the console table: 7 OF ACORNS. Leaving the yard, Hostile 1: \"Heard you downed both helicopters in less than a minute.\" The hostiles believe Bond is their own shooter.\n\nCommand tent. Crossed the tarp-covered camp past the yellow dome to a dark hangar-shaped tent. Door: RESTRICTED ACCESS / AUTHORIZED PERSONNEL ONLY; plate ISLEFORD DEFENCE SYSTEMS IDS-TX100, Serial No 04567, Last Inspection 03-08-24; stencil X100-04567-24, COMMAND TENT, MADE IN UNITED KINGDOM. Inside, Bond: \"Any bombs I should know of?\" Enter tent completed. Folding table with papers and a notebook, stacked flight cases. Through an orange fabric tunnel; Handler: \"I can't. You're still on a need-to-know basis.\" The tunnel opened into the dome: white backdrop screens under film-style floodlights, cases, cables. Search the camp completed, save. New objective: Inspect crashed object. Near a rack of red-lit cylinders wired together, Bond muttered \"Distortion. Oscillating... or...\"\n\nThe wreck. Around the white screens, past flight cases, a table with an orange jacket and a hatch-like white door, into the centre: a smoking crater with the twisted, charred wreckage of a large craft. Bond: \"I'm looking at the thing now. Or what's left of it.\" Handler: \"Right. On board computer. The size of a shoebox.\" Waypoint 7m into the wreck. Inside, a square blue-lit compartment with a metal cradle and an empty shoebox-sized slot. Handler: \"Damn. Have a look around the tent for it.\" Inspect crashed object completed; new objective LOOK FOR THE ON-BOARD COMPUTER. You opened crates and flight cases around the crater (papers scattered on the floor, a folded robotic-arm rig, a rugged case against the tent wall, a small case of rolled tubes and canisters at the crater's edge), finding nothing. Ended at a bench draped with a yellow tarp: a Universal Exports flight case, a kit bag stamped Property of the Government of the United Kingdom, and the red-lit wired cylinder rack. Autosave.\n\nPoisoning. Two figures in orange hazmat suits and gas masks came in through the dome's round airlock hatch. Vision turned green and blurred. NEW OBJECTIVE: FIND ANTIDOTE, autosave. Hunched, you crossed the cables to the red medical-cross door, through the red-lit ringed airlock tunnel. On the far side, in a yellow haze, a hazmat figure's legs stood over you as you crawled across a grated floor. Green-lit medical hut: steel shelving, supply cabinet, a window with more orange suits beyond, a shelf with an open case and vials spilled on the floor. Pushed past a drawer cabinet of pill bottles and shelving of flight cases. Screen to black. On return, a masked hostile in a parka lay on the grated floor with eyes open; Bond, vision clear: \"That might be pushing it. What next?\" What happened in the blackout is not shown. Bond now wears his Navy flight suit with a chest rig rather than the parka. Handler: \"Where they'll be meeting and at what time.\" Next, crouched among rocks outside at dawn, Royal Navy crown patch on the shoulder. Autosave.\n\nFollow the guards. Red-jacketed and parka-clad hostiles gathered near hut F4; one called \"Wrap it up. We're leaving.\" Objective: Follow the guards. Through a narrow rock crevice to a ledge over a lower yard by hut F8, tracked-vehicle trails, hostiles walking below, a body in an orange jumpsuit in the dirt. Cutscene: Bond surveyed the camp: \"But the hostiles plan to blow up the place.\" Follow the guards completed. New objective SAVE THE CAPTIVES. Bond: \"Okay James, two containers: B4 or G9. Which one's first?\"\n\nContainer G9. Sub-objective: Search containers B4 and G9. Crouched through tall grass below F8 while hostiles moved in the yard, climbed into rocks (\"Ok, no time to hesitate.\"), sighted the lit container G9 across a gully. Through a crevice to a ledge with a Drop down prompt: \"Should be able to use that crevasse to avoid being spotted.\" Dropped beside G9, crouched behind crates (dash-to-cover hint) while Hostile 1 out in the yard said \"Look at this. Guy was writing home to his wife.\" Inside G9: a control room with a whiteboard of aerial/satellite photos and notes and a panel of switches. Lone hostile in tan jacket and headset: \"Remind me why I'm the one babysitting these breathing problems?\" You crept up behind him, pinned him with a takedown, left him unconscious. Sub-objective Get the keys completed. Search containers B4 and G9 continues, 7m marker on a keypad door. Last frame: crossing G9's office past a desk with a monitor of camera/photo feeds, an open flight case, a desk lamp, papers, and a framed photo of a climber on the wall; the marker points left toward the keypad door.\n\nOdd details worth keeping: the game autosaves as Bond remarks he learned a few phrases mountain climbing; a card collectible called 7 of Acorns sitting by a transporter remote; a framed photograph of a climber on the wall of a hostage container; a hostile referring to the captives as \"breathing problems,\" which may mean they are sick or poisoned like Bond was.\n\nEquipment status: Bond has no firearm taken (SMG left in A2). Keys from the G9 guard. Parka acquired but he is now seen in flight suit and chest rig. Briefcase in A2 never examined.", "quest_notes": [{"quest": "Prologue: helicopter mission", "status": "open", "detail": "Two helicopters (Lead, Follow) ambushed by missiles; Follow shot down; Bond gave the Exit order and the lead aircraft crashed into water. Bond survived alone. Fate of Follow's crew and the soldiers aboard Lead unknown. MI6 Handler has taken over the mission by radio."}, {"quest": "Chapter: AGAINST THE ODDS", "status": "open", "detail": "Current chapter; title card appeared on cresting the mountain above the valley camp."}, {"quest": "Objective: Locate the camp", "status": "done", "detail": "Found the large floodlit dome in the valley beyond the mountain."}, {"quest": "Objective: Reach the camp", "status": "done", "detail": "Dropped from the cliff into the lagoon, snuck past red-jacketed guards on the shore, climbed through a window into hut A2."}, {"quest": "Objective: Search the room (hut A2)", "status": "done", "detail": "Found the shot man in the orange jumpsuit in the washroom and a hostile's SMG on the bench. Briefcase on a crate had an Inspect prompt and was not clearly examined."}, {"quest": "Objective: Search the camp", "status": "done", "detail": "Inspected the encrypted Radio and the Rocket Launcher (serial 394 KLB 211); sub-objectives Move the BT-65 and Enter tent completed; finished on reaching the dome through the command tent's tunnel."}, {"quest": "Objective: Inspect crashed object", "status": "done", "detail": "Looked inside the wreck's blue-lit compartment; the on-board computer's cradle is empty."}, {"quest": "Objective: Look for the on-board computer", "status": "open", "detail": "Shoebox-sized retrieval target, already removed from the crashed craft. Crates and flight cases around the crater searched without result; interrupted by the poisoning. Not yet found."}, {"quest": "Objective: Find antidote", "status": "done", "detail": "Poisoned in the dome tent after hazmat figures entered; staggered through the airlock tunnel to the medical hut; recovered after a blackout with a masked hostile left on the floor."}, {"quest": "MI6 Handler's instruction: find out where they'll be meeting and at what time", "status": "open", "detail": "Given after the antidote. Who 'they' are and how Bond is to learn it is not yet stated. The whiteboard and desk monitor in G9 may be relevant."}, {"quest": "Objective: Follow the guards", "status": "done", "detail": "Shadowed the hostiles from hut F4 through a rock crevice to a ledge above hut F8; learned the hostiles plan to blow up the camp."}, {"quest": "Objective: Save the Captives — Search containers B4 and G9", "status": "open", "detail": "Bond is inside G9 with the keys; a keypad door is marked 7m away, off to the left of the office desk. B4 has not been visited."}, {"quest": "Sub-objective: Get the keys", "status": "done", "detail": "Took down the lone tan-jacketed guard inside G9 from behind and took his keys."}, {"quest": "Hostiles pulling out and planning to blow up the camp", "status": "thread", "detail": "'Wrap it up. We're leaving.' near hut F4. Likely tied to the MI6 explosives stockpiled on the shore. Time pressure on the captives."}, {"quest": "Who the captives are", "status": "thread", "detail": "G9 guard called them 'these breathing problems' — possibly poisoned or ill, like Bond was in the dome."}, {"quest": "G9 office desk and whiteboard", "status": "thread", "detail": "Monitor showing camera/photo feeds, an open flight case and papers on the desk; a whiteboard of aerial/satellite photos and notes; a framed photo of a climber on the wall. None examined yet."}, {"quest": "Rocket Launcher serial 394 KLB 211", "status": "thread", "detail": "Anti-aircraft guided missile system found in a camp hut; likely weapon that downed the helicopters. Bond read the serial aloud to the Handler; no follow-up yet."}, {"quest": "Hostiles mistake Bond for their shooter", "status": "thread", "detail": "Hostile 1 said he heard Bond downed both helicopters in less than a minute. The real shooter is somewhere in or near the camp."}, {"quest": "The crashed craft and the wired cylinders", "status": "thread", "detail": "Large scorched wreck with a blue-lit compartment inside the dome; a red-lit rack of wired cylinders on a tarp bench beside UK-government-marked kit and a Universal Exports flight case. Bond asked about bombs and got no answer; muttered 'Distortion. Oscillating... or...'."}, {"quest": "What poisoned Bond in the dome", "status": "thread", "detail": "Vision turned green after two hazmat-suited figures came through the airlock. Source not identified: the craft, the cylinders, or a deliberate attack."}, {"quest": "Medical hut blackout", "status": "thread", "detail": "Screen went black; on return a masked hostile in a parka lay on the floor and Bond had switched from the Parka to his flight suit and chest rig. Events not shown."}, {"quest": "Orange-jumpsuit bodies", "status": "thread", "detail": "One shot dead in hut A2's washroom, a second lying in the yard near hut F8. Hostile 1's remark 'Guy was writing home to his wife' may refer to one of them."}, {"quest": "MI6's role at the camp", "status": "thread", "detail": "MI6 explosives on the shore, a UK-made Isleford Defence Systems command tent, Universal Exports and UK-government kit in the dome. The Handler keeps Bond on a need-to-know basis and took over a Navy mission."}, {"quest": "Hut A2 Briefcase", "status": "thread", "detail": "Inspect prompt appeared on a Briefcase on a crate; not examined before leaving."}, {"quest": "Messy German job", "status": "thread", "detail": "Overheard from hostiles in the equipment yard; unexplained."}, {"quest": "Flashlight searchers on the beach", "status": "thread", "detail": "Armed men sweeping the crash shoreline; identity unconfirmed, presumably the camp's hostiles."}, {"quest": "Red churning water shot", "status": "thread", "detail": "Brief cut to a boiling red surface of foam and smoke after Bond came ashore; unexplained."}, {"quest": "Bond's local-language phrases", "status": "thread", "detail": "Bond says he picked up a few phrases while mountain climbing here; language and relevance not yet shown."}, {"quest": "Collectibles: 7 of Acorns", "status": "thread", "detail": "One card found near the BT-65 remote console. Purpose of the acorn cards unknown."}, {"quest": "Locked Movement tutorials", "status": "thread", "detail": "Three locked entries under Movement in the Tutorials tab alongside Dash and Crouch."}], "frames": ["1789575331.jpg", "1789573635.jpg", "1789573645.jpg", "1789573754.jpg", "1789573855.jpg", "1789573882.jpg", "1789574072.jpg", "1789574278.jpg", "1789574399.jpg", "1789574543.jpg", "1789574680.jpg", "1789574792.jpg", "1789574917.jpg", "1789575028.jpg", "1789575314.jpg", "1789575328.jpg"], "videos": ["recap-dossier.mp4", "recap-cozy.mp4"], "created": 1789663549.094589, "save_card": true}], "state": {"game": "007 First Light", "character": "James Bond (young Royal Navy pilot, not yet a 00)", "current_goal": "Save the captives — with the keys taken from the guard in G9, open the marked door in container G9, then search container B4; still find out where/when the hostiles will meet and locate the crashed craft's on-board computer", "last_location": "Office area inside container G9 (desk with monitor and open flight case) at the valley camp, dawn", "open_quests": ["Prologue: helicopter mission (helicopters ambushed by missiles; ordered to Exit; lead helicopter crashed into water; Bond survived and reached the shore; armed men with torches searching the shore; MI6 Handler has taken control of the mission by radio — retrieval of the crashed craft's on-board computer)", "Chapter: AGAINST THE ODDS", "Objective: Look for the on-board computer (missing from the wreck's compartment — searching the dome tent; several crates and flight cases opened without result; interrupted by poisoning)", "MI6 Handler's instruction: find out 'where they'll be meeting and at what time'", "Objective: Save the captives — sub-objective: Search containers B4 and G9 (keys obtained from the G9 guard; a keypad door inside G9 marked nearby, Bond crossing G9's office toward it; B4 still to do)", "The hostiles plan to blow up the camp and are pulling out ('Wrap it up. We're leaving.')"], "completed_quests": ["Objective: Locate the camp (large floodlit dome in the valley beyond the mountain)", "Objective: Reach the camp (snuck past red-jacketed guards on the shore and climbed through a window into hut A2)", "Objective: Search the room (hut A2 — found the shot man in the orange jumpsuit and a hostile's SMG in the washroom)", "Sub-objective: Move the BT-65 (backed the tracked transporter up using the remote console)", "Sub-objective: Enter tent (Isleford Defence Systems command tent)", "Objective: Search the camp (completed on reaching the dome through the tent's tunnel)", "Objective: Inspect crashed object (looked inside the wreck's blue-lit compartment — the on-board computer's cradle is empty)", "Objective: Find antidote (Bond recovered in the medical hut; a masked hostile was left lying on the floor)", "Objective: Follow the guards (shadowed the departing hostiles through a rock crevice to a ledge above hut F8)", "Sub-objective: Get the keys (took down the lone guard inside container G9 from behind)"], "key_items": ["Parka (taken from a kit bag in hut A2; Bond is now seen back in his Navy flight suit with chest rig)", "Briefcase (on a crate in hut A2, inspectable — not clearly examined before leaving)", "SMG (on a bench in hut A2's washroom, 'belongs to one of the hostiles' — inspected, not taken)", "Radio (military grade, encrypted — inspected on a crate in a camp hut)", "Rocket Launcher (Serial 394 KLB 211, GUIDED MISSILE SYSTEM INTERCEPT-AERIAL — inspected on a desk in a camp hut; Bond read the serial aloud)", "Remote console for the BT-65 tracked transporter (used to back it up)", "7 of Acorns (collectible card, picked up in the equipment yard)", "On board computer (shoebox-sized — the retrieval target; already removed from the crashed craft — not yet found)", "Universal Exports flight case (in the dome tent beside the wired-cylinder rack)", "Kit bag marked 'Property of the Government of the United Kingdom' (on the Universal Exports case in the dome tent)", "Antidote (taken in the medical hut — Bond's poisoning cured)", "Containers B4 and G9 (where the captives are held — Bond is inside G9; B4 not yet visited)", "Keys (taken from the guard in container G9 — 'Get the keys' completed)", "Whiteboard of aerial/satellite photos and notes inside container G9 (not yet examined)", "Desk in G9's office with a monitor showing camera/photo feeds, an open flight case and papers (not examined)"], "people": ["Base (radio voice)", "Lead (helicopter callsign)", "Follow (second helicopter, shot down)", "Bond (helmetless Royal Navy helicopter pilot, survived the crash — player character; poisoned in the dome and cured with the antidote)", "MI6 Handler (voice on the radio, has taken control of the mission; withheld details on a 'need-to-know basis', revealed the target is the crashed craft's shoebox-sized on board computer; MI6 is running the camp; warns Bond not to draw attention; told Bond to search the tent when the computer proved missing; now wants to know where 'they' will be meeting and at what time)", "Armed soldiers in the helicopter cabin", "Armed men with flashlights searching the shoreline (hostile searchers)", "Men in red jackets guarding crates of MI6 explosives at the camp shore", "Dead man in an orange jumpsuit in hut A2's washroom (shot, slumped against a bloodied electrical cabinet)", "Hostiles (owners of the SMG left in hut A2's washroom)", "Hooded figure on the ramp of the camp's stores shed", "Masked armed guard in a dark parka standing among the crates outside hut A2", "Hostile 1 (masked parka-clad man in the equipment yard who ordered Bond to back up the transporter; believes Bond 'downed both helicopters in less than a minute'; later heard near G9: 'Guy was writing home to his wife')", "Masked hostiles in parkas working around the tracked transporter and dome (some armed with SMGs; overheard mentioning 'a messy German job')", "Figures in orange hazmat suits and gas masks (two entered the dome through the airlock as Bond fell ill; one stood over him in the tunnel; more seen through the medical hut window)", "Masked hostile in a parka left lying on the medical hut floor after Bond recovered (downed by Bond?)", "Group of hostiles (red jackets and parkas) gathering near hut F4 and moving out — one ordered 'Wrap it up. We're leaving.'", "Hostiles moving about the lower yard around hut F8 (seen from the grass)", "Captives held in containers B4 and G9 (identity unknown; the G9 guard called them 'these breathing problems')", "Second body in an orange jumpsuit lying in the lower yard near hut F8", "Lone hostile guarding container G9 (headset, tan jacket; complained about 'babysitting these breathing problems'; knocked out by Bond, keys taken)"], "unresolved": ["Who the captives in containers B4 and G9 are — the G9 guard referred to them as 'breathing problems' (poisoned/ill?); Bond has the keys and is heading for G9's inner door", "What the monitor and open flight case on G9's office desk show/contain", "How and when the hostiles intend to blow up the camp (the MI6 explosives stockpile?) and where they are leaving to", "Who 'they' are that the MI6 Handler wants the meeting place and time for, and how Bond is to find out", "What the whiteboard of aerial photos inside container G9 shows", "Who the dead man 'writing home to his wife' was (hostile 1's remark near G9 — one of the orange-jumpsuit bodies?)", "What happened in the medical hut during the blackout — did Bond knock out the masked hostile, and did the hazmat figures intend to poison him?", "What poisoned Bond inside the dome tent (the crashed craft? the wired cylinders?)", "Who removed the on-board computer from the crashed craft, and where it is now (crates and flight cases around the crater searched without result)", "What the crashed craft inside the dome is — a large scorched wreck with a glowing blue-lit square compartment inside", "What the red-lit rack of wired cylinders in the dome is (bombs? Bond asked 'Any bombs I should know of?') — it sits on a tarp-covered bench next to UK-government-marked kit", "Why Universal Exports equipment and 'Property of the Government of the United Kingdom' kit are in the dome tent", "Who shot the man in the orange jumpsuit in hut A2, and who he was; who the second orange-jumpsuit body in the yard is", "Why a hostile's SMG was left behind in hut A2's washroom", "What the Briefcase in hut A2 contains", "MI6 explosives are stockpiled at the camp — why", "Who shot the helicopters down — the anti-aircraft Rocket Launcher (serial 394 KLB 211) found in the camp hut is the likely weapon; the hostiles mistake Bond for the shooter who 'downed both helicopters in less than a minute'", "Who the flashlight-carrying searchers on the beach are", "Fate of the crew after the 'Exit' order — was Follow's crew lost?", "What happened to the soldiers aboard the lead helicopter?", "What the red churning water/smoke shot at the end signifies", "Who the MI6 Handler is and why MI6 is taking over a Navy mission", "What else the MI6 Handler is hiding from Bond ('need-to-know basis')", "Whether the red-jacketed camp personnel are friendly to Bond or must be avoided", "Who the encrypted military radio belongs to", "What the 'messy German job' the hostiles mentioned was", "Who Isleford Defence Systems are and why their UK-made command tent is at this camp", "What the acorn collectible cards are for (7 of Acorns found)", "What language Bond 'picked up a few phrases' of while mountain climbing, and why it matters here", "What the three locked Movement tutorial skills are"], "known_names": ["Base", "Lead", "Follow", "Pilot", "Dash", "Crouch", "Bond", "MI6 Handler", "Sprint", "Hang", "Against the Odds", "Drop down", "A2", "Parka", "Search the room", "Briefcase", "Inspect", "SMG", "Look", "Search the camp", "Rations", "Radio", "Rocket Launcher", "Hostile 1", "Exit", "LG 209", "Move the BT-65", "BT-65", "Enter tent", "7 of Acorns", "Isleford Defence Systems", "IDS-TX100", "Command Tent", "Inspect crashed object", "On board computer", "Look for the on-board computer", "Universal Exports", "Property of the Government of the United Kingdom", "Find antidote", "Hostile", "Follow the guards", "F4", "F8", "Save the Captives", "B4", "G9", "James", "Search containers B4 and G9", "Get the keys"]}, "brief": {"game": "007 First Light", "premise": "An original-continuity origin story for James Bond from IO Interactive, released in 2026 on PC, PlayStation 5, Xbox Series and Switch 2. A reckless 26-year-old Royal Navy pilot is pulled into MI6 and has to prove he deserves the 00 prefix, learning tradecraft on live operations rather than in a classroom. The tone is early-Bond adventure: gadgets, cars, glamour and a conspiracy reaching inside the Service itself.", "protagonist": "James Bond — a young, not-yet-licensed agent played in third person. On screen he is a slim dark-haired man in his twenties, more often in a flight suit, jacket or tactical wear early on than in the dinner jacket, and he fights with improvised objects and close-quarters takedowns as readily as with a pistol.", "characters": [{"name": "James Bond", "who": "The player character; a cocky recruit rather than the polished veteran. Recognisable by his youth, his running/vaulting parkour animations and the camera locked over his shoulder."}, {"name": "M", "who": "Head of MI6 and Bond's sceptical boss in this game a woman. Appears in briefing scenes in formal office wear inside MI6 interiors, usually delivering mission framing over a desk or conference table."}, {"name": "John Greenwood", "who": "Bond's mentor figure and the Service's technical man, the Q role in this continuity. Older, measured, seen handing over equipment and talking Bond through jobs on the radio."}, {"name": "Moneypenny", "who": "MI6 staffer and Bond's gatekeeper to M; shows up in the headquarters hub sequences, typically in conversation scenes with dialogue options."}, {"name": "Greg Wilson (009)", "who": "An established Double-O who acts as the model, rival and standard Bond is measured against. Shown as the competent professional in the field beside the untested Bond."}, {"name": "Miss Roth", "who": "A young woman entangled in the plot who works with and against Bond in the early story; appears in cutscene-heavy, dialogue-driven scenes rather than as a combat ally."}], "enemies": [{"name": "Patrolling guards", "what": "Basic hostiles on fixed routes; they show suspicion build-up before fully spotting you and will call others in, the core stealth threat of every early level."}, {"name": "Alerted search parties", "what": "Once detected, guards drop patrol routes and sweep the area in groups, checking cover and forcing Bond to break line of sight and re-hide."}, {"name": "Heavies / armoured enforcers", "what": "Larger, slower, more damage-absorbing opponents who resist quick takedowns and force melee exchanges or gadget use."}, {"name": "Security cameras and alarms", "what": "Environmental enemies: fixed lenses and alarm panels that escalate an area to full alert if Bond is seen and not dealt with."}, {"name": "Private security / mercenaries", "what": "Uniformed corporate or estate guards guarding the villain's sites, usually matching, colour-coded outfits that make restricted-zone rules readable."}, {"name": "Marksmen in elevated positions", "what": "Long-sightline shooters who punish standing in the open during firefight set-pieces and chases."}], "locations": [{"name": "MI6 Headquarters", "what": "The London Secret Intelligence Service building; a safe hub of offices, briefing rooms and equipment areas where conversations and mission setup happen with no combat."}, {"name": "Alpine mountain facility", "what": "A snowbound high-altitude site reached by cable car, all white peaks, steel walkways and glass — the signature early showcase level from pre-release footage."}, {"name": "Cable car / funicular line", "what": "A vertical traversal set-piece: suspended cabins, cables and pylons over a drop, used for climbing, hanging and a scripted action beat."}, {"name": "Luxury estate / party venue", "what": "A social infiltration space of dressed guests, bars and restricted back rooms where being out of place raises suspicion rather than instantly triggering gunfire."}, {"name": "Airfield and aircraft", "what": "Runways, hangars and planes tied to Bond's Royal Navy pilot background, appearing in the game's opening stretch."}, {"name": "European city streets", "what": "Narrow roads and urban rooftops used for vehicle chases and foot pursuits, with drivable sequences cutting between them."}], "things": [{"name": "Walther PPK", "what": "Bond's compact sidearm; low ammo, quiet and precise, meant for measured shots rather than sustained firefights."}, {"name": "Aston Martin DB5", "what": "The silver classic Aston; appears both in cutscenes and in playable driving sections, the game's most instantly recognisable object."}, {"name": "Q Branch gadgets", "what": "Mission-issued tools handed over in briefings — distraction, hacking and access devices selected from a small loadout wheel or quick-use slot."}, {"name": "Improvised weapons", "what": "Bottles, tools and loose objects picked up from the environment for a single throw or knockout, an IO Interactive signature carried over from Hitman."}, {"name": "Takedowns", "what": "Contextual close-quarters grabs from behind or from cover that drop an enemy silently; bodies can then be moved out of sight."}, {"name": "Dialogue choices", "what": "Branching conversation prompts that let you play Bond as charming, blunt or evasive, shown as a short list of options during story scenes."}, {"name": "Cover and vaulting traversal", "what": "Free-running climbs, ledge hangs, ducts and railing vaults that give each level multiple routes past guarded ground floors."}, {"name": "Disguise-free blending", "what": "Rather than full costume swaps, Bond blends with crowds and social settings, with detection driven by where he is and who is watching."}], "chapters": [{"name": "Prologue: the Navy pilot", "what": "The opening establishes Bond before MI6 — aviation, insubordination and the incident that brings him to the Service's attention."}, {"name": "Recruitment at MI6", "what": "First visit to headquarters: meeting M, Moneypenny and Greenwood, learning the interface through low-threat walk-and-talk scenes."}, {"name": "First field assignment", "what": "A supervised early job that teaches patrol observation, takedowns and the consequences of being spotted."}, {"name": "The alpine operation", "what": "The mountain facility infiltration shown in pre-release footage: cable car approach, snow exteriors and an escalating escape."}, {"name": "The chase", "what": "A driving set-piece with the DB5 through roads and traffic, breaking up the on-foot stealth chapters."}, {"name": "Proving the 00", "what": "The later arc where Bond's unauthorised choices and the conspiracy inside the Service decide whether he earns the Double-O number."}], "vocabulary": ["00 status / Double-O", "00 Section", "MI6 / the Service", "M", "Q Branch", "Moneypenny", "009", "Walther PPK", "Aston Martin DB5", "takedown", "gadget", "dialogue choice", "mission briefing"], "tone": "Glamorous, fast and slightly cocky spy-thriller — classic Bond style filtered through a young agent who hasn't earned the licence yet."}, "pack": "dossier", "accent": "#7FB3FF", "last_played": 1789575339.7826219}], "sessions": {"bond-part1": {"name": "bond-part1", "meta": {"started": 1789573539.778622, "ended": 1789575339.7826219, "video": "/Users/amit/repos/previously-on/video/007FirstLightPlaythrough.webm", "clip": [0.0, 1800.004], "frames": 151, "source": "file", "title": "007FirstLightPlaythrough"}, "events": [{"t": 1789573540, "t_end": 1789573585, "frames": ["1789573540.jpg", "1789573542.jpg", "1789573567.jpg", "1789573583.jpg", "1789573584.jpg", "1789573585.jpg"], "game": "007 First Light", "location": "Opening cutscene — military helicopters flying low through fog at night", "activity": "Starting a new game and watching the prologue's opening cinematic", "summary": "You started 007 First Light from the title screen (\"Press X to play\"). After a brief loading screen, the opening cinematic began: two dark military helicopters fly low through night fog, lit by a red flare, while a radio voice from \"Base\" tells \"Lead\" that mission details are in. This is the very start of the prologue, before any gameplay.", "events": [{"type": "other", "text": "Started a new game from the 007 First Light title screen", "frame": 2, "frame_file": "1789573542.jpg"}, {"type": "dialogue", "text": "Base: Lead. Mission details are in.", "frame": 5, "frame_file": "1789573584.jpg"}, {"type": "discovery", "text": "Opening cinematic: two military helicopters flying through night fog toward a mission", "frame": 6, "frame_file": "1789573585.jpg"}], "on_screen_text": ["FIRST LIGHT", "Press X to play", "Base: Lead. Mission details are in."]}, {"t": 1789573610, "t_end": 1789573645, "frames": ["1789573610.jpg", "1789573625.jpg", "1789573628.jpg", "1789573630.jpg", "1789573635.jpg", "1789573645.jpg"], "game": "007 First Light", "location": "Opening cutscene — inside a military helicopter under missile attack at night", "activity": "Watching the prologue cinematic: the helicopter flight comes under fire", "summary": "The prologue cinematic continued. Inside the helicopter cockpit, a helmeted pilot in a Royal Navy flight suit listened as Base finished the briefing (\"That's all I've got\"). Red tracer lights appeared outside the window, and the pilot called \"Break left. We've got incoming. Deploying flares.\" as the helicopter banked and spat a spread of countermeasure flares. In the cabin, a squad of armed soldiers in helmets and body armour braced as the pilot radioed \"Base, we are under attack. Follow is down.\" — the second helicopter was shot down. The cabin then filled with orange fire and smoke as the pilot reported \"Severe damage. More incoming. Exit. Repeat Exit.\" — the helicopter is going down and the crew are ordered to bail out.", "events": [{"type": "dialogue", "text": "Base: \"That's all I've got.\" — end of the mission details, heard by a helmeted pilot in a Royal Navy flight suit", "frame": 1, "frame_file": "1789573610.jpg"}, {"type": "other", "text": "Helicopter comes under fire — Pilot: \"Break left. We've got incoming. Deploying flares.\" as the aircraft banks and releases countermeasure flares", "frame": 3, "frame_file": "1789573628.jpg"}, {"type": "other", "text": "Pilot: \"Base, we are under attack. Follow is down.\" — the second helicopter (Follow) is shot down while armed soldiers brace in the cabin", "frame": 5, "frame_file": "1789573635.jpg"}, {"type": "other", "text": "Cabin fills with fire and smoke — Pilot: \"Severe damage. More incoming. Exit. Repeat Exit.\" — order to bail out of the crippled helicopter", "frame": 6, "frame_file": "1789573645.jpg"}], "on_screen_text": ["Base: That's all I've got.", "Pilot: Break left. We've got incoming. Deploying flares.", "Pilot: Base, we are under attack. Follow is down.", "Pilot: Severe damage. More incoming. Exit. Repeat Exit."]}, {"t": 1789573649, "t_end": 1789573729, "frames": ["1789573649.jpg", "1789573653.jpg", "1789573654.jpg", "1789573679.jpg", "1789573704.jpg", "1789573729.jpg"], "game": "007 First Light", "location": "Opening cutscene — bailing out of the burning helicopter, then underwater in the dark", "activity": "Watching the prologue cinematic: the helicopter crash and the pilot sinking underwater", "summary": "The prologue cinematic continued from the 'Exit' order. The helmeted Royal Navy pilot rose from the cockpit and reached out toward the cabin, gesturing to the soldiers, as the interior filled with orange fire and smoke; the armed troops braced by the open door amid the glow. The screen then cut to black. When the picture returned it was murky darkness: a faint shaft of reddish light slanting through what looks like water, drifting particles and bubbles, then a dim red glow below. Finally a figure in a flight suit — the pilot, now without a helmet, dark-haired — is seen sinking limply underwater, one arm raised, faintly lit from above. The helicopter has evidently gone down in water and the pilot is submerged; whether he survives, and what became of the soldiers, is not yet shown.", "events": [{"type": "other", "text": "The pilot stood in the burning helicopter cabin and gestured to the soldiers as fire and smoke filled the interior", "frame": 1, "frame_file": "1789573649.jpg"}, {"type": "other", "text": "Cut to black — the helicopter goes down", "frame": 3, "frame_file": "1789573654.jpg"}, {"type": "other", "text": "Underwater: dark water with a faint shaft of red light and drifting particles — the helicopter has crashed into water", "frame": 4, "frame_file": "1789573679.jpg"}, {"type": "other", "text": "The pilot, helmet gone, sinks limply underwater with an arm raised — fate unknown", "frame": 6, "frame_file": "1789573729.jpg"}], "on_screen_text": []}, {"t": 1789573754, "t_end": 1789573820, "frames": ["1789573754.jpg", "1789573776.jpg", "1789573796.jpg", "1789573803.jpg", "1789573814.jpg", "1789573820.jpg"], "game": "007 First Light", "location": "Rocky shoreline beside the burning helicopter wreckage, at night", "activity": "Surfacing from the crash and gaining control of the pilot on the shore", "summary": "The pilot survives: he breaks the surface gasping, one hand clawing at a rock, then wades out of the water through a field of burning wreckage. Standing on a dark, rocky shoreline he looks across at the fire-lit debris of the crashed helicopter strewn along the cliffs, embers drifting in the air. The game hands you control here — a \"Move\" prompt appears (with a \"Look\" hint later) and you walk the flight-suited pilot along the rocks, his Royal Navy patch visible on the shoulder. Then the view cuts to a churning, blood-red boil of foam and smoke, apparently another cut back into the fiery water.", "events": [{"type": "other", "text": "The pilot surfaces from the water alive, gasping and gripping a rock", "frame": 1, "frame_file": "1789573754.jpg"}, {"type": "other", "text": "He wades out of the water through burning wreckage onto the shore", "frame": 2, "frame_file": "1789573776.jpg"}, {"type": "discovery", "text": "First playable control: 'Move' prompt on a rocky night shoreline beside the burning helicopter wreckage", "frame": 4, "frame_file": "1789573803.jpg"}, {"type": "other", "text": "Cut to a red, churning surface of foam and smoke", "frame": 6, "frame_file": "1789573820.jpg"}], "on_screen_text": ["Move.", "Look"]}, {"t": 1789573823, "t_end": 1789573868, "frames": ["1789573823.jpg", "1789573828.jpg", "1789573839.jpg", "1789573851.jpg", "1789573855.jpg", "1789573868.jpg"], "game": "007 First Light", "location": "Rocky night shoreline beside the burning helicopter wreckage", "activity": "Walking the crash-site shoreline through burning wreckage in the playable prologue, listening to radio static", "summary": "Still in control of the flight-suited pilot on the dark shoreline. You walk him past a tangle of smouldering wreckage and along the rocks, the Royal Navy patch on his shoulder catching the firelight, while only \"[Radio static]\" comes over the comms — nobody answers. He wanders the beach past scattered debris and a stretch of fully burning wreckage, then stops in the dark and presses a hand to his ear/radio, apparently trying to raise someone. No one from either helicopter has appeared.", "events": [{"type": "other", "text": "Pilot walks the shoreline past the burning helicopter wreckage; radio gives only static", "frame": 3, "frame_file": "1789573839.jpg"}, {"type": "discovery", "text": "Pilot passes a field of fully burning wreckage on the beach; no survivors seen", "frame": 5, "frame_file": "1789573855.jpg"}, {"type": "other", "text": "Pilot stops in the dark and puts a hand to his ear, trying to raise someone on the radio", "frame": 6, "frame_file": "1789573868.jpg"}], "on_screen_text": ["[Radio static]"]}, {"t": 1789573882, "t_end": 1789573972, "frames": ["1789573882.jpg", "1789573893.jpg", "1789573918.jpg", "1789573940.jpg", "1789573960.jpg", "1789573972.jpg"], "game": "007 First Light", "location": "Rocky night shoreline and a stream gully leading to burning helicopter wreckage", "activity": "Sneaking through tall grass past flashlight-carrying armed men, then approaching the burning wreck; checked the Tutorials menu (Crouch)", "summary": "Still on the dark shoreline in the flight suit, you spot several armed figures with torches sweeping the beach and rocks — not friendly rescue, they're searching. You drop into a crouch and creep through the tall grass behind boulders while their beams sweep past, then follow a shallow stream up a rocky gully toward a red glow. At the top you stand at the edge of the smouldering, sparking helicopter wreckage, looking down at a heap of twisted metal. You then open the pause menu Tutorials tab, where the Crouch entry (\"Press [stick] to crouch. Move while crouched in tall grass to stay hidden.\") sits alongside Dash and three locked movement skills.", "events": [{"type": "discovery", "text": "Armed men with flashlights are searching the shoreline where the pilot came ashore", "frame": 1, "frame_file": "1789573882.jpg"}, {"type": "other", "text": "You crouch and sneak through tall grass behind rocks to avoid the torch beams of the searchers", "frame": 2, "frame_file": "1789573893.jpg"}, {"type": "other", "text": "You follow a stream up a rocky gully toward the red glow of the wreck", "frame": 4, "frame_file": "1789573940.jpg"}, {"type": "discovery", "text": "You reach the burning, sparking helicopter wreckage lodged in the rocks", "frame": 5, "frame_file": "1789573960.jpg"}, {"type": "menu", "text": "Tutorials menu: Movement — Dash, Crouch ('Move while crouched in tall grass to stay hidden.'), three entries locked", "frame": 6, "frame_file": "1789573972.jpg"}], "on_screen_text": ["PAUSE MENU", "TUTORIALS", "OPTIONS", "MOVEMENT/", "DASH", "LOCKED", "CROUCH", "Press [stick] to crouch.", "Move while crouched in tall grass to stay hidden.", "Select", "Back"]}, {"t": 1789573997, "t_end": 1789574122, "frames": ["1789573997.jpg", "1789574022.jpg", "1789574047.jpg", "1789574072.jpg", "1789574097.jpg", "1789574122.jpg"], "game": "007 First Light", "location": "Rocky gully and hillside above the shoreline, near the helicopter crash site", "activity": "Sneaking past searchers, then a cutscene where an MI6 handler takes over the mission by radio; new objective to locate the camp", "summary": "You crouch through the stream gully and tall grass while torch-carrying searchers keep sweeping the rocks nearby. Slumped against the hillside in the flight suit, face bloodied, you finally get a voice on the radio: an \"MI6 Handler\" announces \"We're taking control of this mission, effective immediately.\" Asked what you can see, you answer, \"No, but there's some light coming from the other side of the mountain.\" The game now names the pilot as Bond. The objective \"Locate the camp\" appears and you head uphill, muttering \"Gotta find higher ground.\"", "events": [{"type": "dialogue", "text": "MI6 Handler (radio): \"We're taking control of this mission, effective immediately.\" — first contact since the crash; the pilot is revealed to be Bond", "frame": 4, "frame_file": "1789574072.jpg"}, {"type": "dialogue", "text": "Bond: \"No, but there's some light coming from the other side of the mountain.\"", "frame": 5, "frame_file": "1789574097.jpg"}, {"type": "quest_accepted", "text": "Objective: Locate the camp — Bond: \"Gotta find higher ground.\"", "frame": 6, "frame_file": "1789574122.jpg"}], "on_screen_text": ["MI6 Handler: We're taking control of this mission, effective immediately.", "Bond: No, but there's some light coming from the other side of the mountain.", "Locate the camp", "Bond: Gotta find higher ground."]}, {"t": 1789574147, "t_end": 1789574257, "frames": ["1789574147.jpg", "1789574172.jpg", "1789574197.jpg", "1789574222.jpg", "1789574242.jpg", "1789574257.jpg"], "game": "007 First Light", "location": "Cliff ledges and narrow rock passages above the shoreline, climbing the mountain toward the light", "activity": "Climbing and traversing cliffs and caves while talking to the MI6 Handler on the radio, objective \"Locate the camp\"", "summary": "Still under the objective \"Locate the camp\", you shimmy along a narrow lichen-covered ledge high on a cliff face, then squeeze through a tight rain-slicked crevice as a \"Sprint\" tutorial pops up. Emerging into a cavern with a waterfall, the MI6 Handler says \"That's good. Keep your eyes peeled.\" You push back on the radio: \"How can I help if I don't know what's going on?\" You keep climbing, using a \"Hang\" prompt to grab a rock ledge, and come out onto a grassy shelf beneath a cliff wall, still heading for higher ground.", "events": [{"type": "other", "text": "Shimmied along a narrow ledge on a cliff face and squeezed through a tight crevice; Sprint tutorial appeared", "frame": 2, "frame_file": "1789574172.jpg"}, {"type": "dialogue", "text": "MI6 Handler: That's good. Keep your eyes peeled.", "frame": 3, "frame_file": "1789574197.jpg"}, {"type": "dialogue", "text": "Bond: How can I help if I don't know what's going on?", "frame": 4, "frame_file": "1789574222.jpg"}, {"type": "other", "text": "Used the Hang prompt to climb a rock ledge in a dark cave, continuing uphill toward the camp", "frame": 5, "frame_file": "1789574242.jpg"}], "on_screen_text": ["Locate the camp", "TUTORIALS SPRINT", "Press for additional info.", "MI6 Handler: That's good. Keep your eyes peeled.", "Bond: How can I help if I don't know what's going on?", "Hang"]}, {"t": 1789574278, "t_end": 1789574353, "frames": ["1789574278.jpg", "1789574300.jpg", "1789574312.jpg", "1789574337.jpg", "1789574349.jpg", "1789574353.jpg"], "game": "007 First Light", "location": "Cliffs above a valley camp with a large floodlit dome, then the shallow water at the valley floor", "activity": "Cutscene reveal of the camp, then climbing down the cliff and dropping into water to reach it", "summary": "You crest the mountain and the camp comes into view below: a big glowing dome ringed by floodlights in a dark valley. The chapter title card \"AGAINST THE ODDS\" appears as Bond quips over the radio, \"Retrieval mission. Of what exactly. Alien technology?\" — the objective updates to \"Reach the camp\". You pick your way down through rain-slicked rocks and moss, hang from a cliff face over the valley with the dome in the distance, and take the \"Drop down\" prompt into the water below. You surface in a shallow lagoon marked by orange-lit poles and red buoys, with the camp's floodlights on the horizon, and wade toward the shore.", "events": [{"type": "discovery", "text": "Chapter title card \"AGAINST THE ODDS\" as the camp is revealed: a large floodlit dome in the valley below the mountain", "frame": 1, "frame_file": "1789574278.jpg"}, {"type": "dialogue", "text": "Bond (to the MI6 Handler): \"Retrieval mission. Of what exactly. Alien technology?\" — the mission is now framed as a retrieval job", "frame": 1, "frame_file": "1789574278.jpg"}, {"type": "quest_progress", "text": "Objective updated: \"Reach the camp\"", "frame": 2, "frame_file": "1789574300.jpg"}, {"type": "other", "text": "Hanging from the cliff face above the valley, you use the \"Drop down\" prompt to plunge into the water below", "frame": 4, "frame_file": "1789574337.jpg"}, {"type": "other", "text": "Surface in a shallow lagoon marked by orange-lit poles and red floats, camp floodlights visible on the horizon; wading toward the camp", "frame": 6, "frame_file": "1789574353.jpg"}], "on_screen_text": ["AGAINST THE ODDS", "Bond: Retrieval mission. Of what exactly. Alien technology?", "Reach the camp", "Drop down"]}, {"t": 1789574374, "t_end": 1789574485, "frames": ["1789574374.jpg", "1789574399.jpg", "1789574424.jpg", "1789574443.jpg", "1789574460.jpg", "1789574485.jpg"], "game": "007 First Light", "location": "Valley camp on the shore below the mountain — outside and inside a prefab hut marked \"A2\"", "activity": "Sneaking past camp guards at the shore, crawling through a window into hut A2, and finding a parka inside", "summary": "From the lagoon you crouch through tall grass along a rocky, rain-soaked shore, staying low as a figure in red patrols above. Peering over a boulder you spot two men in red jackets standing by crates at the water's edge, with the camp's floodlit huts behind them; Bond notes over the radio, \"MI6 explosives. You're the ones running the retrieval mission.\" — so the camp belongs to MI6's operation. You skirt the rocks to a dark prefab building labelled A2 with a lit window and say, \"There's a window here I can get through.\" Inside, in a bunk room, Bond pulls a parka out of a kit bag (\"A Parka.\") and the objective \"Reach the camp\" is ticked complete, with the game autosaving as he remarks he \"picked up a few phrases while mountain climbing there\" — evidently the locals speak a language he knows a little of.", "events": [{"type": "dialogue", "text": "Bond, watching two red-jacketed men by crates at the shore: \"MI6 explosives. You're the ones running the retrieval mission.\"", "frame": 2, "frame_file": "1789574399.jpg"}, {"type": "dialogue", "text": "Bond outside hut A2: \"There's a window here I can get through.\"", "frame": 4, "frame_file": "1789574443.jpg"}, {"type": "item", "text": "Inside hut A2 Bond pulls a Parka out of a kit bag: \"A Parka.\"", "frame": 5, "frame_file": "1789574460.jpg"}, {"type": "quest_completed", "text": "Objective completed: Reach the camp (autosave)", "frame": 6, "frame_file": "1789574485.jpg"}, {"type": "dialogue", "text": "Bond: \"Picked up a few phrases while mountain climbing there.\"", "frame": 6, "frame_file": "1789574485.jpg"}], "on_screen_text": ["Reach the camp", "Bond: MI6 explosives. You're the ones running the retrieval mission.", "A2", "Bond: There's a window here I can get through.", "Bond: A Parka.", "Bond: Picked up a few phrases while mountain climbing there.", "SAVING"]}, {"t": 1789574503, "t_end": 1789574543, "frames": ["1789574503.jpg", "1789574513.jpg", "1789574515.jpg", "1789574529.jpg", "1789574535.jpg", "1789574543.jpg"], "game": "007 First Light", "location": "Inside prefab hut A2 at the valley camp — bunk room and adjoining washroom", "activity": "Searching hut A2 in the Parka; finds a body in an orange jumpsuit slumped in the washroom and reports he's been shot", "summary": "Now wearing the Parka, you work through hut A2 under the objective \"Search the room\": a card table with a kit bag, a bulletin board with maps, a Briefcase on a crate that can be inspected, and bunks. Peering through a doorway you glimpse a man in an orange jumpsuit slumped against a cabinet with blood on the wall, then walk into the washroom — broken glass on the floor, a bloodied mirror — and Bond reports, \"Someone's lying here. He's been shot.\"", "events": [{"type": "quest_progress", "text": "Objective: Search the room — Bond, in the Parka, searches hut A2 (card table with kit bag, map board, bunks)", "frame": 2, "frame_file": "1789574513.jpg"}, {"type": "discovery", "text": "A Briefcase sitting on a crate in hut A2 can be inspected (Inspect prompt)", "frame": 3, "frame_file": "1789574515.jpg"}, {"type": "discovery", "text": "In the hut's washroom Bond finds a man in an orange jumpsuit slumped dead against a cabinet, blood on the wall and glass on the floor. Bond: \"Someone's lying here. He's been shot.\"", "frame": 6, "frame_file": "1789574543.jpg"}], "on_screen_text": ["Search the room", "BRIEFCASE", "Inspect", "Bond: Someone's lying here. He's been shot."]}, {"t": 1789574548, "t_end": 1789574588, "frames": ["1789574548.jpg", "1789574560.jpg", "1789574564.jpg", "1789574566.jpg", "1789574584.jpg", "1789574588.jpg"], "game": "007 First Light", "location": "Washroom of prefab hut A2 at the valley camp", "activity": "Searching the hut A2 washroom — inspecting a hostile's SMG and the shot man in the orange jumpsuit", "summary": "Still under \"Search the room\" in hut A2's washroom, you find an SMG lying on a bench beside a towel; the inspect card reads \"SMG — Belongs to one of the hostiles.\" You then crouch over the dead man in the orange jumpsuit slumped against a bloodied electrical cabinet, glance into a toilet stall, and finish at the sinks facing the mirror, with the room still unsearched for further clues.", "events": [{"type": "item", "text": "Inspected an SMG on a bench in the hut A2 washroom: \"Belongs to one of the hostiles.\"", "frame": 1, "frame_file": "1789574548.jpg"}, {"type": "discovery", "text": "Examined the shot man in the orange jumpsuit slumped against a blood-spattered electrical cabinet in hut A2's washroom", "frame": 3, "frame_file": "1789574564.jpg"}], "on_screen_text": ["Search the room", "INSPECT", "SMG", "Belongs to one of the hostiles.", "Look"]}, {"t": 1789574600, "t_end": 1789574635, "frames": ["1789574600.jpg", "1789574603.jpg", "1789574609.jpg", "1789574618.jpg", "1789574626.jpg", "1789574635.jpg"], "game": "007 First Light", "location": "Valley camp exterior, among supply crates and a floodlit stores shed outside hut A2", "activity": "Left hut A2 after searching it and now sneaking through the camp under the objective \"Search the camp\", avoiding a masked guard by the crates", "summary": "You leave the washroom, pass back through hut A2's bunk room (crates, an electrical cabinet and a toppled camp chair) and step outside, where the MI6 Handler warns \"Don't draw attention to yourself.\" The objective changes to \"Search the camp\". Outside you crouch past a floodlit stores shed stacked with RATIONS boxes and a hooded figure on its ramp, then find yourself face to face with a masked, armed guard in a dark parka standing between the crates, with the big dome of the camp lit up behind him.", "events": [{"type": "dialogue", "text": "MI6 Handler: \"Don't draw attention to yourself.\" as Bond steps out of hut A2 into the camp", "frame": 3, "frame_file": "1789574609.jpg"}, {"type": "quest_completed", "text": "Objective \"Search the room\" (hut A2) ends", "frame": 4, "frame_file": "1789574618.jpg"}, {"type": "quest_accepted", "text": "New objective: \"Search the camp\"", "frame": 4, "frame_file": "1789574618.jpg"}, {"type": "discovery", "text": "Floodlit stores shed outside hut A2 stacked with RATIONS crates; a hooded figure is standing on its ramp", "frame": 4, "frame_file": "1789574618.jpg"}, {"type": "other", "text": "A masked, armed guard in a dark parka stands among the crates directly ahead of Bond, with the camp's large dome visible behind", "frame": 6, "frame_file": "1789574635.jpg"}], "on_screen_text": ["Search the room", "MI6 Handler: Don't draw attention to yourself.", "Look", "Search the camp", "RATIONS"]}, {"t": 1789574645, "t_end": 1789574712, "frames": ["1789574645.jpg", "1789574653.jpg", "1789574678.jpg", "1789574680.jpg", "1789574700.jpg", "1789574712.jpg"], "game": "007 First Light", "location": "Valley camp — container hut and equipment yard near a tracked transporter, in front of the floodlit dome", "activity": "Searching the camp's huts, inspecting a military radio and a rocket launcher, then hiding behind a tracked vehicle as a hostile shouts at you", "summary": "Still on \"Search the camp\", you walk past the open doorway of a shipping-container hut (marked LG 209) with a masked guard standing outside beside a lit stores area. Inside a hut you crouch and inspect a RADIO on a crate — \"Military grade. Encrypted.\" — then move to a desk where a rocket launcher lies in an open case beside papers and a torch. Inspecting it reveals \"ROCKET LAUNCHER — Serial: 394 KLB 211\", with stencilling reading \"GUIDED MISSILE SYSTEM INTERCEPT-AERIAL\", and Bond reads out: \"Rocket launcher. Serial three nine four, KLB, two one one.\" Back outside, you crouch behind crates and a muddy tracked transporter (numbered 618) with the dome ahead and several masked, parka-clad hostiles moving around the yard. One of them spots you and shouts \"Hey! You! Back this up for me! Remote's right there!\" — apparently mistaking you for one of them and ordering you to reverse the transporter.", "events": [{"type": "item", "text": "Inspected RADIO on a crate inside a camp hut: \"Military grade. Encrypted.\"", "frame": 2, "frame_file": "1789574653.jpg"}, {"type": "discovery", "text": "Found a rocket launcher in an open case on a desk; inspected it: \"ROCKET LAUNCHER — Serial: 394 KLB 211\", stencilled GUIDED MISSILE SYSTEM / INTERCEPT-AERIAL. Bond: \"Rocket launcher. Serial three nine four, KLB, two one one.\" — likely the type of weapon that downed the helicopters", "frame": 4, "frame_file": "1789574680.jpg"}, {"type": "dialogue", "text": "Hiding behind a tracked transporter (618) in the yard before the dome, a masked hostile shouts: \"Hey! You! Back this up for me! Remote's right there!\" — taking Bond for one of the crew", "frame": 6, "frame_file": "1789574712.jpg"}], "on_screen_text": ["Search the camp", "LG 209", "INSPECT RADIO", "Military grade. Encrypted.", "Exit", "Look", "INSPECT ROCKET LAUNCHER", "Serial: 394 KLB 211.", "GUIDED MISSILE SYSTEM INTERCEPT-AERIAL", "Bond: Rocket launcher. Serial three nine four, KLB, two one one.", "Hostile 1: Hey! You! Back this up for me! Remote's right there!", "618"]}, {"t": 1789574714, "t_end": 1789574784, "frames": ["1789574714.jpg", "1789574733.jpg", "1789574743.jpg", "1789574756.jpg", "1789574759.jpg", "1789574784.jpg"], "game": "007 First Light", "location": "Valley camp equipment yard and stores shed, in front of the floodlit dome", "activity": "Blending in as a camp worker: moving the BT-65 transporter by remote, eavesdropping on hostiles, then being told to enter the big central tent", "summary": "Playing along with the hostile's order, you get a new sub-objective \"MOVE THE BT-65\" and stand at the remote-control console (a rugged case with a screen) beside the muddy tracked transporter while masked, parka-clad hostiles pass by; the transporter rolls back towards the stores shed and its shelving of ration crates. As armed hostiles walk past, Bond remarks \"Some of them just mentioned a messy German job.\" Inside the stores shed, the MI6 Handler cuts in: \"Listen, I'm going to ask you to enter the big central tent.\" A new sub-objective, \"Enter tent\", appears, and near the console table you pick up a collectible: \"7 OF ACORNS\".", "events": [{"type": "quest_progress", "text": "NEW SUB-OBJECTIVE: MOVE THE BT-65 — Bond stands at the remote-control console to back up the tracked transporter (the BT-65) as ordered by the hostile", "frame": 1, "frame_file": "1789574714.jpg"}, {"type": "dialogue", "text": "Bond: \"Some of them just mentioned a messy German job.\" — overheard from armed hostiles walking past while he moves the BT-65", "frame": 3, "frame_file": "1789574743.jpg"}, {"type": "dialogue", "text": "MI6 Handler: \"Listen, I'm going to ask you to enter the big central tent.\"", "frame": 4, "frame_file": "1789574756.jpg"}, {"type": "quest_progress", "text": "New sub-objective: Enter tent (under Search the camp); Move the BT-65 is done", "frame": 6, "frame_file": "1789574784.jpg"}, {"type": "item", "text": "NEW COLLECTIBLE: 7 OF ACORNS picked up near the remote console table in the equipment yard", "frame": 6, "frame_file": "1789574784.jpg"}], "on_screen_text": ["Search the camp", "NEW SUB-OBJECTIVE MOVE THE BT-65", "Move the BT-65", "Bond: Some of them just mentioned a messy German job.", "MI6 Handler: Listen, I'm going to ask you to enter the big central tent.", "Enter tent", "NEW COLLECTIBLE 7 OF ACORNS"]}, {"t": 1789574792, "t_end": 1789574824, "frames": ["1789574792.jpg", "1789574797.jpg", "1789574800.jpg", "1789574807.jpg", "1789574815.jpg", "1789574824.jpg"], "game": "007 First Light", "location": "Valley camp — path from the equipment yard to the door of the dark command tent beside the floodlit dome", "activity": "Walking through the camp in the parka towards the central tent's restricted-access door", "summary": "Leaving the equipment yard, Hostile 1 calls after you: \"Heard you downed both helicopters in less than a minute.\" — the hostiles are taking you for the man who shot the helicopters down. You pick your way across the rocky, tarp-covered camp past crates and floodlights, passing the big yellow dome, to a dark hangar-shaped tent whose lit door reads \"RESTRICTED ACCESS — AUTHORIZED PERSONNEL ONLY\", with a plate for \"ISLEFORD DEFENCE SYSTEMS IDS-TX100, Serial No 04567, Last Inspection 03-08-24\" and \"MADE IN UNITED KINGDOM\". You reach the door, about to enter.", "events": [{"type": "dialogue", "text": "Hostile 1: \"Heard you downed both helicopters in less than a minute.\" — the hostiles believe Bond is the one who shot down the helicopters", "frame": 1, "frame_file": "1789574792.jpg"}, {"type": "quest_progress", "text": "Crossed the camp towards the objective marker; reached the dark command tent next to the floodlit dome (Enter tent)", "frame": 5, "frame_file": "1789574815.jpg"}, {"type": "discovery", "text": "Tent door: RESTRICTED ACCESS / AUTHORIZED PERSONNEL ONLY; plate ISLEFORD DEFENCE SYSTEMS IDS-TX100, SERIAL No 04567, LAST INSPECTION 03-08-24; stencil X100-04567-24, COMMAND TENT, MADE IN UNITED KINGDOM", "frame": 6, "frame_file": "1789574824.jpg"}], "on_screen_text": ["Search the camp", "Enter tent", "Hostile 1: Heard you downed both helicopters in less than a minute.", "SAVING", "RESTRICTED ACCESS AUTHORIZED PERSONNEL ONLY", "ISLEFORD DEFENCE SYSTEMS", "IDS-TX100", "SERIAL N° 04567", "LAST INSPECTION 03-08-24", "X100-04567-24", "COMMAND TENT", "MADE IN UNITED KINGDOM"]}, {"t": 1789574827, "t_end": 1789574866, "frames": ["1789574827.jpg", "1789574833.jpg", "1789574839.jpg", "1789574851.jpg", "1789574854.jpg", "1789574866.jpg"], "game": "007 First Light", "location": "Valley camp — inside the Isleford Defence Systems command tent, through an orange tunnel corridor into the floodlit dome", "activity": "Searching the command tent and dome; objective changed to \"Inspect crashed object\"", "summary": "You step inside the dark command tent and ask the MI6 Handler, \"Any bombs I should know of?\" — \"Enter tent\" ticks off. The tent holds a folding table with papers and a notebook and stacked flight cases. As you push on through an orange fabric tunnel toward the dome, the Handler refuses to explain: \"I can't. You're still on a need-to-know basis.\" The tunnel opens into the big dome: a white backdrop under film-style floodlights, cases, cables, and — \"Search the camp\" completes, the game saves. The new objective is \"Inspect crashed object\". Near a rack of red-lit cylinders wired together in the dome, Bond mutters, \"Distortion. Oscillating... or...\"", "events": [{"type": "dialogue", "text": "Entering the command tent, Bond asks the MI6 Handler: \"Any bombs I should know of?\"", "frame": 1, "frame_file": "1789574827.jpg"}, {"type": "quest_progress", "text": "Sub-objective 'Enter tent' completed — inside: folding table with papers/notebook and stacked flight cases", "frame": 2, "frame_file": "1789574833.jpg"}, {"type": "dialogue", "text": "MI6 Handler, as Bond walks the orange tunnel toward the dome: \"I can't. You're still on a need-to-know basis.\"", "frame": 3, "frame_file": "1789574839.jpg"}, {"type": "quest_completed", "text": "'Search the camp' completed on entering the floodlit dome (white backdrop screens under studio floodlights); game saves", "frame": 5, "frame_file": "1789574854.jpg"}, {"type": "quest_accepted", "text": "New objective: 'Inspect crashed object'", "frame": 6, "frame_file": "1789574866.jpg"}, {"type": "discovery", "text": "Inside the dome: a rack of red-lit cylinders wired together; Bond mutters \"Distortion. Oscillating... or...\"", "frame": 6, "frame_file": "1789574866.jpg"}], "on_screen_text": ["Search the camp", "Enter tent", "Bond: Any bombs I should know of?", "MI6 Handler: I can't. You're still on a need-to-know basis.", "SAVING", "Inspect crashed object", "Bond: Distortion. Oscillating... or..."]}, {"t": 1789574868, "t_end": 1789574904, "frames": ["1789574868.jpg", "1789574879.jpg", "1789574885.jpg", "1789574888.jpg", "1789574894.jpg", "1789574904.jpg"], "game": "007 First Light", "location": "Valley camp — inside the floodlit dome, at the crashed object's crater", "activity": "Inspecting the crashed object", "summary": "You work your way around the white plastic screens inside the dome, past stacked flight cases, a table with an orange jacket and a hatch-like white door, and into the centre: a smoking crater filled with the twisted, charred wreckage of a large crashed craft under floodlights. Bond reports, \"I'm looking at the thing now. Or what's left of it.\" The MI6 Handler finally says what the retrieval is for: \"Right. On board computer. The size of a shoebox.\" A 7m waypoint marks the wreck's interior.", "events": [{"type": "discovery", "text": "Behind the dome's white screens Bond finds the crashed object: a crater of smoking, scorched wreckage of a large craft. Bond: 'I'm looking at the thing now. Or what's left of it.'", "frame": 5, "frame_file": "1789574894.jpg"}, {"type": "quest_progress", "text": "MI6 Handler reveals the retrieval target: 'Right. On board computer. The size of a shoebox.' Waypoint 7m into the wreck.", "frame": 6, "frame_file": "1789574904.jpg"}], "on_screen_text": ["Inspect crashed object", "Bond: Distortion. Oscillating... or...", "Bond: I'm looking at the thing now. Or what's left of it.", "MI6 Handler: Right. On board computer. The size of a shoebox.", "7m"]}, {"t": 1789574911, "t_end": 1789574923, "frames": ["1789574911.jpg", "1789574912.jpg", "1789574917.jpg", "1789574918.jpg", "1789574921.jpg", "1789574923.jpg"], "game": "007 First Light", "location": "Valley camp, inside the floodlit dome at the crashed craft's crater", "activity": "Inspected the crashed craft's glowing interior; the on-board computer is missing, so now searching the dome tent for it", "summary": "You walk into the mouth of the charred wreck, where a square, blue-lit compartment glows inside the twisted hull. Looking in, you fin
